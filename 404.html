<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The X Date — Demo (iPhone)</title>

    <!-- Leaflet CSS for the map -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin="anonymous"
    />

    <style>
      :root { --border:#e6e6e6; --muted:#666; --bg:#f6f7f9; --ink:#0f1115; }

      /* Center the phone frame on the page */
      html, body, #root {
        height: 100%;
        margin: 0;
        background: var(--bg);
        display: grid;
        place-items: center;
      }

      /* iPhone device frame */
      .iphone {
        width: 390px;     /* iPhone 12/13/14 logical width */
        height: 844px;    /* iPhone 12/13/14 logical height */
        background: #fff;
        border-radius: 48px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.12);
        border: 10px solid #111; /* bezel */
      }

      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 210px;
        height: 30px;
        background: #111;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
        z-index: 10;
      }

      .screen {
        position: absolute;
        inset: 0;
        padding-top: 30px; /* space for notch */
        background: #fff;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .statusbar {
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px;
        font-size: 12px;
        color: #444;
      }

      .appbar {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
      }

      .page { height: 100%; overflow: hidden; }    /* was overflow:auto */
      .leaflet-container { width: 100%; height: 100%; min-height: 380px; }


      /* App UI helpers */
      .pad { padding: 16px; }
      .btn {
        display: inline-block;
        background: #111;
        color: #fff;
        border: none;
        padding: 12px 14px;
        border-radius: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }
      .btn.secondary { background:#f5f5f5; color:#111; border:1px solid var(--border); }
      .btn.block { width: 100%; }
      .stack { display: grid; gap: 12px; }
      .card { border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
      .muted { color: #666; font-size: 12px; }
      .tabs { display: flex; gap: 8px; }
      .tabs .btn { flex: 1; }
      .list { display: grid; gap: 10px; }
      .list-item {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Leaflet map container should fill available space */
      .leaflet-container { width: 100%; height: 100%; }
    </style>
    <script type="module" crossorigin src="/thexdate-demo/assets/index-5vrQ_gI9.js"></script>
    <link rel="stylesheet" crossorigin href="/thexdate-demo/assets/index-CIGW-MKW.css">
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
