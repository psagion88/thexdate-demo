<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The X Date — Demo (iPhone)</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin="anonymous"
    />

    <style>
      :root { --border:#e6e6e6; --muted:#666; --bg:#f6f7f9; --ink:#0f1115; }

      html, body, #root {
        height: 100%;
        margin: 0;
        background: var(--bg);
        display: grid;
        place-items: center;
      }

      .iphone {
        width: 390px; height: 844px;
        background: #fff; border-radius: 48px; position: relative; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.12);
        border: 10px solid #111;
      }
      .notch {
        position:absolute; top:0; left:50%; transform:translateX(-50%);
        width:210px; height:30px; background:#111;
        border-bottom-left-radius:18px; border-bottom-right-radius:18px; z-index:10;
      }
      .screen {
        position:absolute; inset:0; padding-top:30px; background:#fff;
        display:grid; grid-template-rows:auto auto 1fr; /* statusbar, appbar, content */
      }
      .statusbar {
        height: 20px; display:flex; align-items:center; justify-content:space-between;
        padding:6px 12px; font-size:12px; color:#444;
      }
      .appbar {
        display:grid; grid-template-columns:80px 1fr 80px; align-items:center;
        padding:8px 10px; border-bottom:1px solid var(--border);
      }
      .appbar .left, .appbar .right { display:flex; gap:8px; align-items:center; }
      .appbar .center { text-align:center; font-weight:700; }
      .iconbtn {
        background:#f7f7f8; border:1px solid var(--border); border-radius:12px;
        padding:8px 10px; font-size:13px; cursor:pointer;
      }
      .iconbtn.primary { background:#111; color:#fff; border-color:#111; }
      .badge { margin-left:6px; font-weight:600; font-size:12px; color:#666; }

      .page { height:100%; overflow:hidden; }
      .pad { padding: 16px; }
      .btn {
        display:inline-block; background:#111; color:#fff; border:none;
        padding:12px 14px; border-radius:14px; font-weight:600; cursor:pointer; text-align:center; text-decoration:none;
      }
      .btn.secondary { background:#f5f5f5; color:#111; border:1px solid var(--border); }
      .btn.block { width:100%; }
      .stack { display:grid; gap:12px; }
      .card { border:1px solid var(--border); border-radius:16px; padding:16px; }
      .muted { color:#666; font-size:12px; }
      .tabs { display:flex; gap:8px; }
      .tabs .btn { flex:1; }
      .list { display:grid; gap:10px; }
      .list-item { border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; }

      .form { display:grid; gap:12px; }
      .row { display:grid; gap:8px; }
      .row.h { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
      .input, .select, .toggle {
        padding:10px; border:1px solid var(--border); border-radius:12px; font-size:14px;
      }
      .toggle { display:flex; align-items:center; gap:8px; padding:10px 12px; }
      .section { margin-top:8px; font-weight:700; }

      /* Leaflet */
      .leaflet-container { width:100%; height:100%; min-height:380px; }
    </style>
    <script type="module" crossorigin src="./assets/index-Do5IXcQ3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CIGW-MKW.css">
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
