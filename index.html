<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The X Date — Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
    <style>
      :root { --border:#e6e6e6; --muted:#666; --bg:#fff; }
      html, body, #root { height: 100%; margin: 0; background: var(--bg); }
      .layout { min-height:100%; display:grid; grid-template-rows: auto 1fr; }
      .topbar { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
      .brand { font-weight: 800; letter-spacing: 0.2px; }
      .spacer { flex: 1; }
      .nav a { margin-left: 10px; text-decoration: none; color: #111; border:1px solid var(--border); padding:8px 10px; border-radius:8px; }
      .container { height:100%; }
      .controls { display:flex; gap:8px; flex-wrap:wrap; padding: 8px 16px; border-bottom: 1px solid var(--border); }
      .controls input, .controls select, .controls button { padding:8px 10px; border:1px solid var(--border); border-radius:8px; }
      .btn { background:#111; color:#fff; border:none; padding:10px 12px; border-radius:10px; cursor:pointer; }
      .btn.secondary { background:#f5f5f5; color:#111; border:1px solid var(--border); }
      .muted { color: var(--muted); font-size: 12px; }
      .list { padding: 12px 16px; display: grid; gap: 12px; overflow:auto; }
      .list-item { border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center; }
    </style>
    <script type="module" crossorigin src="/thexdate-demo/assets/index-C4iMvxmS.js"></script>
    <link rel="stylesheet" crossorigin href="/thexdate-demo/assets/index-CIGW-MKW.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
